<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobat Luar Angkasa - Portal Eksplorasi & Kuis</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            color: #00d2ff;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }
        .subtitle {
            color: #a0aec0;
            font-size: 1.1rem;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .section-title {
            color: #63b3ed;
            margin-bottom: 15px;
            border-bottom: 2px solid rgba(99, 179, 237, 0.3);
            padding-bottom: 8px;
        }
        .planet-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .planet-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            transition: 0.3s;
        }
        .planet-card:hover {
            transform: translateY(-5px);
            border-color: #00d2ff;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
        }
        /* Kuis Styles */
        .quiz-box {
            margin-top: 20px;
        }
        .question {
            font-size: 1.2rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .options button {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            text-align: left;
            transition: 0.2s;
        }
        .options button:hover {
            background: #00d2ff;
            color: #090a0f;
        }
        #result {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #48bb78;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sobat Luar Angkasa 🚀</h1>
        <p class="subtitle">Jelajahi galaksi, pelajari planet, dan uji pengetahuan astronomimu di sini!</p>
    </header>

    <div class="container">
        <!-- Bagian Pengenalan Planet -->
        <h2 class="section-title">🌌 Jelajahi Tata Surya</h2>
        <div class="planet-grid">
            <div class="planet-card">
                <h3>🔴 Mars</h3>
                <p style="font-size: 0.9rem; color: #cbd5e0; margin-top: 5px;">Planet Merah</p>
            </div>
            <div class="planet-card">
                <h3>🪐 Saturnus</h3>
                <p style="font-size: 0.9rem; color: #cbd5e0; margin-top: 5px;">Planet Cincin</p>
            </div>
            <div class="planet-card">
                <h3>🟠 Jupiter</h3>
                <p style="font-size: 0.9rem; color: #cbd5e0; margin-top: 5px;">Terbesar di Tata Surya</p>
            </div>
            <div class="planet-card">
                <h3>🌍 Bumi</h3>
                <p style="font-size: 0.9rem; color: #cbd5e0; margin-top: 5px;">Rumah Kita</p>
            </div>
        </div>

        <!-- Bagian Kuis Interaktif -->
        <h2 class="section-title">✨ Kuis Kilat Astronomi</h2>
        <div class="quiz-box">
            <div class="question" id="question-text">1. Planet apa yang dikenal sebagai Planet Merah?</div>
            <div class="options" id="options-container">
                <button onclick="checkAnswer('Bumi')">A. Bumi</button>
                <button onclick="checkAnswer('Mars')">B. Mars</button>
                <button onclick="checkAnswer('Venus')">C. Venus</button>
            </div>
            <div id="result"></div>
        </div>
    </div>

    <script>
        function checkAnswer(selected) {
            const resultDiv = document.getElementById("result");
            if (selected === 'Mars') {
                resultDiv.innerHTML = "🎉 Benar sekali! Mars adalah Planet Merah.";
                resultDiv.style.color = "#48bb78";
            } else {
                resultDiv.innerHTML = "❌ Kurang tepat, coba lagi ya! Jawabannya adalah Mars.";
                resultDiv.style.color = "#f56565";
            }
        }
    </script>

</body>
</html>
